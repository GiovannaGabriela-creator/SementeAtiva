<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Instituto Semente Ativa — ilustração: pessoas trabalhando juntas em uma comunidade -->
  <ellipse cx="200" cy="300" rx="150" ry="16" fill="#DDD5C2"/>

  <!-- Planta ao fundo, remetendo ao crescimento comunitário -->
  <path d="M330 300 C330 300 326 250 330 220" stroke="#274A32" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M330 250 C305 244 296 222 302 200 C325 206 335 228 330 250Z" fill="#4C8355"/>

  <!-- Figura 1 -->
  <circle cx="130" cy="150" r="20" fill="#C97A2B"/>
  <path d="M100 300 C100 250 110 215 130 215 C150 215 160 250 160 300Z" fill="#3F6B4A"/>
  <path d="M130 215 L150 190" stroke="#274A32" stroke-width="8" stroke-linecap="round"/>

  <!-- Figura 2 (mais alta, ao centro) -->
  <circle cx="200" cy="130" r="22" fill="#9C5D1E"/>
  <path d="M166 300 C166 240 178 200 200 200 C222 200 234 240 234 300Z" fill="#274A32"/>
  <path d="M200 200 L178 168" stroke="#274A32" stroke-width="8" stroke-linecap="round"/>
  <path d="M200 200 L222 168" stroke="#274A32" stroke-width="8" stroke-linecap="round"/>

  <!-- Mãos unidas ao centro, simbolizando colaboração -->
  <circle cx="178" cy="168" r="9" fill="#F3EEDF"/>
  <circle cx="150" cy="190" r="9" fill="#F3EEDF"/>

  <!-- Figura 3 -->
  <circle cx="270" cy="150" r="20" fill="#4E7BB5"/>
  <path d="M240 300 C240 250 250 215 270 215 C290 215 300 250 300 300Z" fill="#6B8F3E"/>
  <path d="M270 215 L250 190" stroke="#274A32" stroke-width="8" stroke-linecap="round"/>
  <circle cx="250" cy="190" r="9" fill="#F3EEDF"/>
</svg>
